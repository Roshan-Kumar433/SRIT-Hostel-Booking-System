<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — SRIT Hostel Booking</title>
  <meta name="description" content="Select your year to browse available hostel rooms at SRIT">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── Sticky Header ───────────────────────────────────────────── -->
  <header class="site-header">
    <div class="header-brand">
      <div class="brand-logo">
        <img src="img/logo.webp" alt="SRIT Logo">
      </div>
      <div class="brand-name">
        Sri Ramakrishna Institute Of Technology
        <span>Hostel Room Booking System</span>
      </div>
    </div>

    <div class="header-user" id="header-user">
      <div class="user-trigger" id="user-trigger" role="button" tabindex="0" aria-haspopup="true">
        <div class="user-avatar" id="header-avatar">?</div>
        <span class="user-name" id="header-user-name">Loading...</span>
        <span class="user-caret">▼</span>
      </div>
      <div class="user-dropdown" role="menu">
        <button class="dropdown-item" role="menuitem">👤 Profile</button>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item logout" id="logout-btn" role="menuitem">🚪 Logout</button>
      </div>
    </div>
  </header>

  <!-- ── Page Body ───────────────────────────────────────────────── -->
  <main class="page-wrapper">
    <!-- Existing Booking Banner (shown if user already booked) -->
    <div id="booking-banner" class="booking-banner" style="display:none"></div>

    <h1 class="page-title">Select Your Year</h1>
    <p class="page-subtitle">Choose your academic year to view available hostel rooms</p>

    <!-- Year Cards (rendered by JS) -->
    <div id="years-grid" class="years-grid"></div>
  </main>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
